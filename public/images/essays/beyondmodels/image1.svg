<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Traditional Agent vs. MAKER Architecture
  </text>
  
  <!-- Left Side: Traditional Agent -->
  <g id="traditional">
    <!-- Background -->
    <rect x="50" y="60" width="500" height="500" fill="#fff" stroke="#e0e0e0" stroke-width="2" rx="10"/>
    
    <!-- Title -->
    <text x="300" y="90" font-size="18" font-weight="bold" text-anchor="middle" fill="#d32f2f">
      Traditional LLM Agent
    </text>
    
    <!-- Large brain icon -->
    <circle cx="300" cy="160" r="40" fill="#d32f2f" opacity="0.2"/>
    <text x="300" y="170" font-size="40" text-anchor="middle">🧠</text>
    
    <!-- Chain of steps -->
    <g id="chain">
      <circle cx="300" cy="240" r="15" fill="#4caf50"/>
      <text x="340" y="245" font-size="12" fill="#666">Step 1</text>
      
      <line x1="300" y1="255" x2="300" y2="280" stroke="#4caf50" stroke-width="3"/>
      
      <circle cx="300" cy="295" r="15" fill="#4caf50"/>
      <text x="340" y="300" font-size="12" fill="#666">Step 2</text>
      
      <line x1="300" y1="310" x2="300" y2="335" stroke="#ff9800" stroke-width="3"/>
      
      <circle cx="300" cy="350" r="15" fill="#ff9800"/>
      <text x="340" y="355" font-size="12" fill="#666">Step 3</text>
      <text x="340" y="370" font-size="11" fill="#ff9800">⚠️ Error starts</text>
      
      <line x1="300" y1="365" x2="300" y2="390" stroke="#ff5722" stroke-width="3" stroke-dasharray="5,5"/>
      
      <circle cx="300" cy="405" r="15" fill="#ff5722"/>
      <text x="340" y="410" font-size="12" fill="#666">Step 4</text>
      
      <line x1="300" y1="420" x2="300" y2="445" stroke="#f44336" stroke-width="4" stroke-dasharray="5,5"/>
      
      <circle cx="300" cy="460" r="15" fill="#f44336"/>
      <text x="340" y="465" font-size="12" fill="#666">Step 5</text>
      
      <!-- Explosion -->
      <text x="300" y="510" font-size="50" text-anchor="middle">💥</text>
      <text x="300" y="540" font-size="14" font-weight="bold" text-anchor="middle" fill="#d32f2f">
        FAILURE CASCADE
      </text>
    </g>
    
    <!-- Annotation -->
    <text x="100" y="380" font-size="11" fill="#666">Error compounds</text>
    <text x="100" y="395" font-size="11" fill="#666">silently through</text>
    <text x="100" y="410" font-size="11" fill="#666">the chain</text>
  </g>
  
  <!-- Right Side: MAKER -->
  <g id="maker">
    <!-- Background -->
    <rect x="650" y="60" width="500" height="500" fill="#fff" stroke="#e0e0e0" stroke-width="2" rx="10"/>
    
    <!-- Title -->
    <text x="900" y="90" font-size="18" font-weight="bold" text-anchor="middle" fill="#4caf50">
      MAKER Architecture
    </text>
    
    <!-- Orchestrator -->
    <rect x="850" y="110" width="100" height="40" fill="#2196f3" rx="5"/>
    <text x="900" y="135" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
      Orchestrator
    </text>
    
    <!-- Verification Layer -->
    <rect x="750" y="180" width="300" height="30" fill="#ff9800" opacity="0.2" rx="5"/>
    <text x="900" y="200" font-size="11" text-anchor="middle" fill="#666">
      🛡️ Verification Gates
    </text>
    
    <!-- Micro-agents network -->
    <g id="microagents">
      <!-- Row 1 -->
      <circle cx="750" cy="250" r="12" fill="#4caf50"/>
      <text x="750" y="255" font-size="10" text-anchor="middle" fill="white">✓</text>
      
      <circle cx="820" cy="250" r="12" fill="#4caf50"/>
      <text x="820" y="255" font-size="10" text-anchor="middle" fill="white">✓</text>
      
      <circle cx="890" cy="250" r="12" fill="#4caf50"/>
      <text x="890" y="255" font-size="10" text-anchor="middle" fill="white">✓</text>
      
      <circle cx="960" cy="250" r="12" fill="#4caf50"/>
      <text x="960" y="255" font-size="10" text-anchor="middle" fill="white">✓</text>
      
      <circle cx="1030" cy="250" r="12" fill="#4caf50"/>
      <text x="1030" y="255" font-size="10" text-anchor="middle" fill="white">✓</text>
      
      <!-- Row 2 -->
      <circle cx="750" cy="300" r="12" fill="#4caf50"/>
      <text x="750" y="305" font-size="10" text-anchor="middle" fill="white">✓</text>
      
      <circle cx="820" cy="300" r="12" fill="#4caf50"/>
      <text x="820" y="305" font-size="10" text-anchor="middle" fill="white">✓</text>
      
      <circle cx="890" cy="300" r="12" fill="#ff9800"/>
      <text x="890" y="305" font-size="10" text-anchor="middle" fill="white">!</text>
      
      <circle cx="960" cy="300" r="12" fill="#4caf50"/>
      <text x="960" y="305" font-size="10" text-anchor="middle" fill="white">✓</text>
      
      <circle cx="1030" cy="300" r="12" fill="#4caf50"/>
      <text x="1030" y="305" font-size="10" text-anchor="middle" fill="white">✓</text>
      
      <!-- Row 3 -->
      <circle cx="750" cy="350" r="12" fill="#4caf50"/>
      <text x="750" y="355" font-size="10" text-anchor="middle" fill="white">✓</text>
      
      <circle cx="820" cy="350" r="12" fill="#4caf50"/>
      <text x="820" y="355" font-size="10" text-anchor="middle" fill="white">✓</text>
      
      <circle cx="890" cy="350" r="12" fill="#4caf50"/>
      <text x="890" y="355" font-size="10" text-anchor="middle" fill="white">✓</text>
      
      <circle cx="960" cy="350" r="12" fill="#4caf50"/>
      <text x="960" y="355" font-size="10" text-anchor="middle" fill="white">✓</text>
      
      <circle cx="1030" cy="350" r="12" fill="#4caf50"/>
      <text x="1030" y="355" font-size="10" text-anchor="middle" fill="white">✓</text>
      
      <!-- Row 4 -->
      <circle cx="750" cy="400" r="12" fill="#4caf50"/>
      <text x="750" y="405" font-size="10" text-anchor="middle" fill="white">✓</text>
      
      <circle cx="820" cy="400" r="12" fill="#4caf50"/>
      <text x="820" y="405" font-size="10" text-anchor="middle" fill="white">✓</text>
      
      <circle cx="890" cy="400" r="12" fill="#4caf50"/>
      <text x="890" y="405" font-size="10" text-anchor="middle" fill="white">✓</text>
      
      <circle cx="960" cy="400" r="12" fill="#4caf50"/>
      <text x="960" y="405" font-size="10" text-anchor="middle" fill="white">✓</text>
      
      <circle cx="1030" cy="400" r="12" fill="#4caf50"/>
      <text x="1030" y="405" font-size="10" text-anchor="middle" fill="white">✓</text>
      
      <!-- Row 5 -->
      <circle cx="750" cy="450" r="12" fill="#4caf50"/>
      <text x="750" y="455" font-size="10" text-anchor="middle" fill="white">✓</text>
      
      <circle cx="820" cy="450" r="12" fill="#4caf50"/>
      <text x="820" y="455" font-size="10" text-anchor="middle" fill="white">✓</text>
      
      <circle cx="890" cy="450" r="12" fill="#4caf50"/>
      <text x="890" y="455" font-size="10" text-anchor="middle" fill="white">✓</text>
      
      <circle cx="960" cy="450" r="12" fill="#4caf50"/>
      <text x="960" y="455" font-size="10" text-anchor="middle" fill="white">✓</text>
      
      <circle cx="1030" cy="450" r="12" fill="#4caf50"/>
      <text x="1030" y="455" font-size="10" text-anchor="middle" fill="white">✓</text>
    </g>
    
    <!-- Connections to orchestrator -->
    <line x1="900" y1="150" x2="750" y2="240" stroke="#2196f3" stroke-width="1" opacity="0.3"/>
    <line x1="900" y1="150" x2="890" y2="240" stroke="#2196f3" stroke-width="1" opacity="0.3"/>
    <line x1="900" y1="150" x2="1030" y2="240" stroke="#2196f3" stroke-width="1" opacity="0.3"/>
    
    <!-- Error correction arrow -->
    <path d="M 890 300 Q 820 320 890 340" fill="none" stroke="#ff9800" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="820" y="325" font-size="10" fill="#ff9800">Reroute</text>
    
    <!-- Success indicator -->
    <text x="900" y="510" font-size="40" text-anchor="middle">✅</text>
    <text x="900" y="540" font-size="14" font-weight="bold" text-anchor="middle" fill="#4caf50">
      ISOLATED FAILURES
    </text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff9800"/>
    </marker>
  </defs>
  
  <!-- Bottom caption -->
  <text x="600" y="585" font-size="13" text-anchor="middle" fill="#666">
    Traditional agents fail when one link breaks. MAKER isolates failures through micro-agent decomposition.
  </text>
</svg>