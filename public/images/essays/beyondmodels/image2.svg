<svg viewBox="0 0 1400 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="700" y="35" font-size="26" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    The Error Cascade: How One Mistake Destroys Everything
  </text>
  
  <!-- Background -->
  <rect x="50" y="70" width="1300" height="480" fill="#fafafa" stroke="#e0e0e0" stroke-width="2" rx="10"/>
  
  <!-- Main Timeline -->
  <line x1="150" y1="300" x2="1250" y2="300" stroke="#bdbdbd" stroke-width="4"/>
  
  <!-- Step markers on timeline -->
  <line x1="150" y1="285" x2="150" y2="315" stroke="#bdbdbd" stroke-width="3"/>
  <line x1="350" y1="285" x2="350" y2="315" stroke="#bdbdbd" stroke-width="3"/>
  <line x1="550" y1="285" x2="550" y2="315" stroke="#bdbdbd" stroke-width="3"/>
  <line x1="800" y1="285" x2="800" y2="315" stroke="#bdbdbd" stroke-width="3"/>
  <line x1="1100" y1="285" x2="1100" y2="315" stroke="#bdbdbd" stroke-width="3"/>
  <line x1="1250" y1="285" x2="1250" y2="315" stroke="#bdbdbd" stroke-width="3"/>
  
  <!-- Step 1-3: Clean execution -->
  <g id="step1">
    <circle cx="200" cy="300" r="30" fill="#4caf50" stroke="#2e7d32" stroke-width="3"/>
    <text x="200" y="310" font-size="18" font-weight="bold" text-anchor="middle" fill="white">1</text>
    <text x="200" y="350" font-size="14" text-anchor="middle" fill="#2e7d32" font-weight="bold">Step 1</text>
    <text x="200" y="368" font-size="12" text-anchor="middle" fill="#4caf50">✓ Perfect</text>
  </g>
  
  <g id="step2">
    <circle cx="275" cy="300" r="30" fill="#4caf50" stroke="#2e7d32" stroke-width="3"/>
    <text x="275" y="310" font-size="18" font-weight="bold" text-anchor="middle" fill="white">2</text>
    <text x="275" y="350" font-size="14" text-anchor="middle" fill="#2e7d32" font-weight="bold">Step 2</text>
    <text x="275" y="368" font-size="12" text-anchor="middle" fill="#4caf50">✓ Perfect</text>
  </g>
  
  <g id="step3">
    <circle cx="350" cy="300" r="30" fill="#4caf50" stroke="#2e7d32" stroke-width="3"/>
    <text x="350" y="310" font-size="18" font-weight="bold" text-anchor="middle" fill="white">3</text>
    <text x="350" y="350" font-size="14" text-anchor="middle" fill="#2e7d32" font-weight="bold">Step 3</text>
    <text x="350" y="368" font-size="12" text-anchor="middle" fill="#4caf50">✓ Perfect</text>
  </g>
  
  <!-- Step 5: Initial Error - THE CRITICAL MOMENT -->
  <g id="step5">
    <circle cx="550" cy="300" r="35" fill="#ff9800" stroke="#f57c00" stroke-width="4"/>
    <text x="550" y="312" font-size="20" font-weight="bold" text-anchor="middle" fill="white">5</text>
    <text x="550" y="355" font-size="14" text-anchor="middle" fill="#e65100" font-weight="bold">Step 5</text>
    <text x="550" y="373" font-size="13" text-anchor="middle" fill="#ff9800">⚠️ Hallucination</text>
    <text x="550" y="390" font-size="11" text-anchor="middle" fill="#999">One wrong token</text>
    
    <!-- Warning callout -->
    <rect x="450" y="120" width="200" height="100" fill="#fff3e0" stroke="#ff9800" stroke-width="3" rx="8"/>
    <text x="550" y="150" font-size="16" font-weight="bold" text-anchor="middle" fill="#e65100">
      ⚠️ INITIAL ERROR
    </text>
    <text x="550" y="175" font-size="12" text-anchor="middle" fill="#666">
      LLM hallucinates a
    </text>
    <text x="550" y="193" font-size="12" text-anchor="middle" fill="#666">
      single token in context
    </text>
    <text x="550" y="211" font-size="11" text-anchor="middle" fill="#ff9800" font-style="italic">
      Seems harmless...
    </text>
    
    <line x1="550" y1="225" x2="550" y2="260" stroke="#ff9800" stroke-width="3" marker-end="url(#arrow-orange)"/>
  </g>
  
  <!-- Step 100: Errors multiplying -->
  <g id="step100">
    <circle cx="800" cy="300" r="40" fill="#ff5722" stroke="#d84315" stroke-width="4"/>
    <text x="800" y="310" font-size="18" font-weight="bold" text-anchor="middle" fill="white">100</text>
    <text x="800" y="365" font-size="14" text-anchor="middle" fill="#bf360c" font-weight="bold">Step 100</text>
    <text x="800" y="383" font-size="13" text-anchor="middle" fill="#ff5722">⚠️⚠️⚠️ Warnings</text>
    <text x="800" y="400" font-size="11" text-anchor="middle" fill="#999">Errors compounding</text>
    
    <!-- Growing error indicator -->
    <path d="M 550 270 Q 675 200 800 270" fill="none" stroke="#ff9800" stroke-width="3" stroke-dasharray="5,5" opacity="0.7"/>
    
    <text x="675" y="220" font-size="11" fill="#ff5722" font-weight="bold">Corruption spreading →</text>
  </g>
  
  <!-- Step 500: Critical corruption -->
  <g id="step500">
    <circle cx="1100" cy="300" r="45" fill="#f44336" stroke="#c62828" stroke-width="5"/>
    <text x="1100" y="310" font-size="18" font-weight="bold" text-anchor="middle" fill="white">500</text>
    <text x="1100" y="370" font-size="14" text-anchor="middle" fill="#b71c1c" font-weight="bold">Step 500</text>
    <text x="1100" y="388" font-size="13" text-anchor="middle" fill="#f44336">🚨🚨🚨 Critical</text>
    <text x="1100" y="405" font-size="11" text-anchor="middle" fill="#999">Context destroyed</text>
    
    <!-- Growing error indicator -->
    <path d="M 800 270 Q 950 180 1100 270" fill="none" stroke="#ff5722" stroke-width="4" stroke-dasharray="5,5" opacity="0.7"/>
  </g>
  
  <!-- Step 1000: Total failure -->
  <g id="step1000">
    <circle cx="1250" cy="300" r="50" fill="#d32f2f" stroke="#b71c1c" stroke-width="6"/>
    <text x="1250" y="312" font-size="18" font-weight="bold" text-anchor="middle" fill="white">1000</text>
    
    <!-- Explosion -->
    <text x="1250" y="180" font-size="70" text-anchor="middle">💥</text>
    
    <text x="1250" y="385" font-size="14" text-anchor="middle" fill="#b71c1c" font-weight="bold">Step 1000</text>
    <text x="1250" y="410" font-size="16" font-weight="bold" text-anchor="middle" fill="#d32f2f">
      CATASTROPHIC
    </text>
    <text x="1250" y="430" font-size="16" font-weight="bold" text-anchor="middle" fill="#d32f2f">
      FAILURE
    </text>
    
    <!-- Final error indicator -->
    <path d="M 1100 270 Q 1175 150 1250 250" fill="none" stroke="#f44336" stroke-width="5" stroke-dasharray="5,5" opacity="0.7"/>
  </g>
  
  <!-- Severity gradient bar -->
  <defs>
    <linearGradient id="severityGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4caf50;stop-opacity:0.4" />
      <stop offset="35%" style="stop-color:#4caf50;stop-opacity:0.4" />
      <stop offset="40%" style="stop-color:#ff9800;stop-opacity:0.4" />
      <stop offset="60%" style="stop-color:#ff5722;stop-opacity:0.4" />
      <stop offset="85%" style="stop-color:#f44336;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#d32f2f;stop-opacity:0.4" />
    </linearGradient>
    
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff9800"/>
    </marker>
  </defs>
  
  <!-- Gradient severity bar -->
  <rect x="150" y="450" width="1100" height="50" fill="url(#severityGradient)" rx="8"/>
  
  <!-- Severity labels -->
  <text x="200" y="482" font-size="13" font-weight="bold" text-anchor="middle" fill="#2e7d32">
    ✓ Clean Execution
  </text>
  
  <text x="550" y="482" font-size="13" font-weight="bold" text-anchor="middle" fill="#e65100">
    ⚠️ Error Introduced
  </text>
  
  <text x="800" y="482" font-size="13" font-weight="bold" text-anchor="middle" fill="#bf360c">
    🔥 Corruption Spreading
  </text>
  
  <text x="1100" y="482" font-size="13" font-weight="bold" text-anchor="middle" fill="#b71c1c">
    🚨 Critical State
  </text>
  
  <text x="1250" y="482" font-size="13" font-weight="bold" text-anchor="middle" fill="#d32f2f">
    💥 Total Collapse
  </text>
  
  <!-- Bottom caption -->
  <text x="700" y="540" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">
    Traditional LLM workflows: Early errors compound silently until catastrophic failure
  </text>
  
  <text x="700" y="565" font-size="13" text-anchor="middle" fill="#666">
    A single hallucinated token at step 5 cascades into complete system collapse by step 1000
  </text>
</svg>
